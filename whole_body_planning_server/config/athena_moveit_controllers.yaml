# MoveIt trajectory execution controllers for Athena (from
# athena_moveit_config/config/moveit_controllers.yaml, wrapped as a ROS 2
# parameter file for the planning server node). Action namespaces are relative
# and resolve under the robot namespace (e.g. /athena/flipper_trajectory_controller/...).
/**:
  ros__parameters:
    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

    moveit_simple_controller_manager:
      controller_names:
        - flipper_trajectory_controller
        - arm_trajectory_controller

      flipper_trajectory_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - flipper_bl_joint
          - flipper_br_joint
          - flipper_fl_joint
          - flipper_fr_joint

      arm_trajectory_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - arm_joint_1
          - arm_joint_2
          - arm_joint_3
          - arm_joint_4
          - arm_joint_5
          - arm_joint_6
          - arm_joint_7
