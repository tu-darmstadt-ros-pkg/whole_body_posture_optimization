# Whole-body planning server on Athena with four flippers and no arm.
# One file for every node of the process: the server, its voxblox ESDF node
# and its MoveItCpp node.
/**:
  ros__parameters:
    # --- Planning server ---
    base_frame: base_footprint_link
    auto_start: true
    override_path_time: true
    continuous_planning: true
    planning_horizon: 2.0
    minimum_path_length: 0.3
    path_sampling_resolution: 0.2
    path_stitching_tolerance: 0.3
    reverse_allowed: false
    ignore_goal_orientation: false
    execution_position_tolerance: 0.0
    execution_orientation_tolerance: 0.0

    # --- ESDF: a voxblox layer on esdf_map_in ---
    world_frame: map
    tsdf_voxel_size: 0.05
    tsdf_voxels_per_side: 16
    esdf_max_distance_m: 2.0
    update_esdf_every_n_sec: 0.0
    # A ground truth layer arrives in one message per 64 blocks, about 24 for a 20 m course
    layer_queue_size: 100
    publish_esdf_map: false
    publish_tsdf_map: false
    publish_pointclouds: false
    publish_slices: false
    update_mesh_every_n_sec: 0.0
    truncation_distance: 2.0
    # Unobserved terrain reads as ground, not as a drop
    terrain_fill: true
    # [s] An infeasible pose is retried with newer maps until this long after the planned part ends (the first attempt without one)
    retry_time: 10.0
    publish_visualisation: false

    # --- Pose prediction (sdf_contact_estimation) ---
    max_iterations: 5
    iteration_contact_threshold: 0.025
    final_contact_threshold: 0.05
    # Below the belly's 3.6 cm above the track bottom, so flat ground is no chassis contact
    chassis_contact_threshold: 0.025
    convexity_threshold: 0.2

    # --- Posture optimization ---
    # Each prediction starts on the highest surface under these x, y pairs (base frame, under the main tracks)
    # within max_step_up above and max_step_down below the previous height
    surface_columns: [0.25, 0.105, 0.0, 0.105, -0.25, 0.105, 0.25, -0.105, 0.0, -0.105, -0.25, -0.105]
    max_step_up: 0.3
    max_step_down: 0.5
    # Stowed
    default_joint_state:
      flipper_fl_joint: 1.5708
      flipper_fr_joint: 1.5708
      flipper_bl_joint: 1.5708
      flipper_br_joint: 1.5708
    optimization_type: split
    stability_limit: 0.0
    front_tip_support_area_limit: 0.0
    complete_robot_group: flipper_group
    complete_robot_with_world_group: flipper_group_with_world
    trajectory_planner: linear
    max_velocity_scaling_factor: 1.0
    max_acceleration_scaling_factor: 1.0
    # 0.3 m/s outer track speed and 0.6 rad/s yaw rate
    max_base_velocity: 0.3
    max_base_yaw_velocity: 0.6
    # The arc sdf_dp_flipper_planner uses on this robot; 1.5708 is stowed
    joint_limits:
      flipper_fl_joint: [-1.24, 1.5708]
      flipper_fr_joint: [-1.24, 1.5708]
      flipper_bl_joint: [-1.24, 1.5708]
      flipper_br_joint: [-1.24, 1.5708]

    flipper_optimization:
      custom_solver:
        enabled: false
        algorithm: grid_search
        search_resolution: 0.174
      solver:
        enabled: true
        algorithm: GN_DIRECT
        maxeval: 120
      # Refines the global optimum and the previous posture
      local_solver:
        enabled: true
        algorithm: LN_SBPLX
        maxeval: 40
      joints:
        - flipper_fl_joint
        - flipper_fr_joint
        - flipper_bl_joint
        - flipper_br_joint
      # The left-right partner of each joint, for symmetry_weight
      mirrored_joints: [flipper_fr_joint, flipper_fl_joint, flipper_br_joint, flipper_bl_joint]
      cost_parameters:
        verbose: false
        stability_weight: 5.0
        stability_nominal_value: 2.0
        # Close to the weakest support polygon edge
        stability_temperature: 0.01
        stability_exp_parameters_a: 14.0
        stability_exp_parameters_b: -2.6
        stability_exp_parameters_c: 0.3
        support_area_weight: 0.0
        track_contact_weight: 8.0
        track_contact_nominal_value: 0.2
        body_contact_weight: 50.0
        roll_cost_weight: 4.0
        position_deviation_weight: 0.0
        # A settled pose that moved further is infeasible
        max_position_deviation: 0.1
        lorentzian_sigma: 0.2
        movement_cost_weight: 1.0
        # Close to the largest joint move
        movement_temperature: 0.05
        turning_resistance_weight: 10.0
        impact_weight: 3.0
        num_pose_x_samples: 1.0
        sample_step_pose_x: 0.01
        pose_x_sigma: 0.03
        risk_level: 0.8
        symmetry_weight: 0.5
        # Tipping between waypoints costs by how far
        transition_weight: 15.0

    arm_optimization:
      enabled: false

    posture_optimization_debug: false
    debug: false
    stepping: false
