# MARV overlay on athena.yaml (launch/wbpo.launch.py overlays:=).
# marv_shape_config.yaml samples the chassis, so body_contact_weight prices its contacts.
/**:
  ros__parameters:
    # fixed_flipper's pose on MARV, where each optimization starts
    default_joint_state:
      flipper_fl_joint: -0.5
      flipper_fr_joint: -0.5
      flipper_bl_joint: -0.5
      flipper_br_joint: -0.5
    # 0 holds a flipper level, positive raises its tip
    joint_limits:
      flipper_fl_joint: [-1.22, 1.22]
      flipper_fr_joint: [-1.22, 1.22]
      flipper_bl_joint: [-1.22, 1.22]
      flipper_br_joint: [-1.22, 1.22]

    flipper_optimization:
      cost_parameters:
        # Upper bound of the parameter, so chassis contact outweighs the track contact reward
        body_contact_weight: 100.0

    # athena.yaml's 0.025 m is below Athena's belly, MARV's belly clearance is not measured
    chassis_contact_threshold: 0.05

    # The flipper pivots, where MARV rests
    surface_columns: [0.256, 0.248, -0.256, 0.248, 0.256, -0.248, -0.256, -0.248]
