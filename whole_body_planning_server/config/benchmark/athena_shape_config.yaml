# Shape (collision sampling) config of Athena for
# sdf_contact_estimation::ShapeModel. Shapes are picked by their index in
# the link's collisions (athena_description xacro).
#
# The chassis and the flippers use the `oval_collision_shape` macro, three shapes:
#   0 = rear wheel cylinder (at the -x end), 1 = belt box, 2 = front wheel cylinder
#
# Main tracks (athena_base.xacro, main_track_link) have eleven shapes:
#   0, 1, 2 = the oval on the outer third of the width (rear wheel, box, front wheel),
#             the full radius and the lowest running surface
#   3 = bottom box, tilted up toward the inner edge
#   4 = top box (not sampled, never a ground contact)
#   5, 6, 7 = front end cylinders (inner, mid, outer), radius growing outward
#   8, 9, 10 = rear end cylinders (inner, mid, outer)
# Front shapes are sampled on their front arc, rear shapes on their rear arc.
#
# Dimensions (athena_description xacro):
#   chassis:    length 0.678, height 0.151, width 0.368  (wheel r = 0.0755)
#   main track: length 0.737, height 0.223, width 0.15   (oval wheel r = 0.1115)
#   flipper:    length 0.5,   height 0.2,   width 0.047   (wheel r = 0.1)
#
# Angle convention (radians) for the wheel cylinders: 3/2*pi .. 5/2*pi
# (4.712 .. 7.854) is the front (+x) half, 1/2*pi .. 3/2*pi the rear half.

joints:
- flipper_fl_joint
- flipper_fr_joint
- flipper_bl_joint
- flipper_br_joint

collision_links:
  # --- Chassis: belly and lower arcs, its contacts count as chassis contacts. ---
- link: chassis_link
  type: body
  resolution: 0.06
  include_indices: [1]
- link: chassis_link
  type: body
  resolution: 0.02
  cylinder_angle_min: 4.712   # 3/2 pi, down
  cylinder_angle_max: 6.2832  # 2 pi, front
  include_indices: [2]
- link: chassis_link
  type: body
  resolution: 0.02
  cylinder_angle_min: 3.1416  # pi, rear
  cylinder_angle_max: 4.712   # 3/2 pi, down
  include_indices: [0]

  # --- Main tracks: front arcs and bottom, then rear arcs. ---
- link: main_track_left_link
  type: main_track
  resolution: &main_track_resolution 0.08
  cylinder_angle_min: &main_tracks_angle_min 4.712    # 3/2 * pi
  cylinder_angle_max: &main_tracks_angle_max 7.85398  # 5/2 * pi
  include_indices: &main_track_front [1, 2, 3, 5, 6, 7]
  invert_y: [1] # make sure sampling points at outer edge

- link: main_track_left_link
  type: main_track
  resolution: *main_track_resolution
  cylinder_angle_min: &main_tracks_rear_angle_min 1.5708  # 1/2 * pi
  cylinder_angle_max: &main_tracks_rear_angle_max 4.712   # 3/2 * pi
  include_indices: &main_track_rear [0, 8, 9, 10]

- link: main_track_right_link
  type: main_track
  resolution: *main_track_resolution
  cylinder_angle_min: *main_tracks_angle_min
  cylinder_angle_max: *main_tracks_angle_max
  include_indices: *main_track_front
  invert_z: [2]

- link: main_track_right_link
  type: main_track
  resolution: *main_track_resolution
  cylinder_angle_min: *main_tracks_rear_angle_min
  cylinder_angle_max: *main_tracks_rear_angle_max
  include_indices: *main_track_rear
  invert_z: [0]


  # --- Flippers: sample both wheels (pivot + tip) bottom arc + belt box. ---
- link: flipper_fl_link
  type: track
  resolution: &flipper_resolution 0.045
  cylinder_angle_min: &flipper_angle_min 4.712
  cylinder_angle_max: &flipper_angle_max 7.85398
  ignore_indices: [0]

- link: flipper_fl_link
  type: track
  resolution: *flipper_resolution
  cylinder_angle_min: 1.5708
  cylinder_angle_max: 4.712
  include_indices: [0]

- link: flipper_fr_link
  type: track
  resolution: *flipper_resolution
  cylinder_angle_min: *flipper_angle_min
  cylinder_angle_max: *flipper_angle_max
  ignore_indices: [0]

- link: flipper_fr_link
  type: track
  resolution: *flipper_resolution
  cylinder_angle_min: 1.5708
  cylinder_angle_max: 4.712
  include_indices: [0]

- link: flipper_bl_link
  type: track
  resolution: *flipper_resolution
  cylinder_angle_min: *flipper_angle_min
  cylinder_angle_max: *flipper_angle_max
  ignore_indices: [0]

- link: flipper_bl_link
  type: track
  resolution: *flipper_resolution
  cylinder_angle_min: 1.5708
  cylinder_angle_max: 4.712
  include_indices: [0]

- link: flipper_br_link
  type: track
  resolution: *flipper_resolution
  cylinder_angle_min: *flipper_angle_min
  cylinder_angle_max: *flipper_angle_max
  ignore_indices: [0]

- link: flipper_br_link
  type: track
  resolution: *flipper_resolution
  cylinder_angle_min: 1.5708
  cylinder_angle_max: 4.712
  include_indices: [0]
