# Contact sampling of MARV (ctu_marv_description) for
# sdf_contact_estimation::ShapeModel. A box is sampled on its bottom face (top
# face with invert_z), a cylinder on the arc [cylinder_angle_min,
# cylinder_angle_max] about its axis.
#
# Collision indices of a flipper link (urdf/robot.xacro), x along the flipper
# from the pivot to the tip:
#   0 = big wheel at the pivot (cylinder, r 0.1165)
#   1 = small wheel at the tip (cylinder, r 0.078, x 0.3035)
#   2 = box inside the belt outline
#   3 = upper belt box
#   4 = lower belt box, its bottom face is the lower belt
# The lower and upper belt and both wheels all around sample the flipper's
# outline at every flipper angle.
#
# Collision indices of chassis_link:
#   0 = body box above the rounded edges
#   1 = belly box between the rounded edges, its bottom face is the belly
#   2 = rounded front lower edge (cylinder, r 0.044)
#   3 = rounded rear lower edge
# As type body the chassis can rest on the terrain, and its contacts count as
# chassis contacts.

joints:
- flipper_fl_joint
- flipper_fr_joint
- flipper_bl_joint
- flipper_br_joint

collision_links:
- link: chassis_link
  type: body
  resolution: 0.06
  include_indices: [1]

- link: chassis_link
  type: body
  resolution: 0.02  # three points on the arc
  cylinder_angle_min: 4.712   # 3/2 pi, down
  cylinder_angle_max: 6.2832  # 2 pi, front
  include_indices: [2]

- link: chassis_link
  type: body
  resolution: 0.02
  cylinder_angle_min: 3.1416  # pi, rear
  cylinder_angle_max: 4.712   # 3/2 pi, down
  include_indices: [3]

- link: flipper_fl_link
  type: track
  resolution: &belt_resolution 0.0375  # three rows across the 0.075 m belt
  include_indices: [4]
- link: flipper_fl_link
  type: track
  resolution: *belt_resolution
  include_indices: [3]
  invert_z: [3]
- link: flipper_fl_link
  type: track
  resolution: *belt_resolution
  cylinder_angle_min: &circle_min 0.0
  cylinder_angle_max: &circle_max 6.2832  # 2 pi
  include_indices: [0]
- link: flipper_fl_link
  type: track
  resolution: *belt_resolution
  cylinder_angle_min: *circle_min
  cylinder_angle_max: *circle_max
  include_indices: [1]

- link: flipper_fr_link
  type: track
  resolution: *belt_resolution
  include_indices: [4]
- link: flipper_fr_link
  type: track
  resolution: *belt_resolution
  include_indices: [3]
  invert_z: [3]
- link: flipper_fr_link
  type: track
  resolution: *belt_resolution
  cylinder_angle_min: *circle_min
  cylinder_angle_max: *circle_max
  include_indices: [0]
- link: flipper_fr_link
  type: track
  resolution: *belt_resolution
  cylinder_angle_min: *circle_min
  cylinder_angle_max: *circle_max
  include_indices: [1]

- link: flipper_bl_link
  type: track
  resolution: *belt_resolution
  include_indices: [4]
- link: flipper_bl_link
  type: track
  resolution: *belt_resolution
  include_indices: [3]
  invert_z: [3]
- link: flipper_bl_link
  type: track
  resolution: *belt_resolution
  cylinder_angle_min: *circle_min
  cylinder_angle_max: *circle_max
  include_indices: [0]
- link: flipper_bl_link
  type: track
  resolution: *belt_resolution
  cylinder_angle_min: *circle_min
  cylinder_angle_max: *circle_max
  include_indices: [1]

- link: flipper_br_link
  type: track
  resolution: *belt_resolution
  include_indices: [4]
- link: flipper_br_link
  type: track
  resolution: *belt_resolution
  include_indices: [3]
  invert_z: [3]
- link: flipper_br_link
  type: track
  resolution: *belt_resolution
  cylinder_angle_min: *circle_min
  cylinder_angle_max: *circle_max
  include_indices: [0]
- link: flipper_br_link
  type: track
  resolution: *belt_resolution
  cylinder_angle_min: *circle_min
  cylinder_angle_max: *circle_max
  include_indices: [1]
