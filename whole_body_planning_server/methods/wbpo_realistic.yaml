# The wbpo method for sensors:=realistic: as methods/wbpo.yaml, with the
# unobserved terrain around the robot filled (config/benchmark/realistic.yaml).
name: wbpo
command: ros2 launch whole_body_planning_server benchmark.launch.py overrides:=$(ros2 pkg prefix whole_body_planning_server)/share/whole_body_planning_server/config/benchmark/realistic.yaml
joint_interface: trajectory
base_interface: follow_path
record_topics: [/whole_body_planning_server/markers]
ready:
  publishers: []
  timeout: 120.0
