# Method file for the Gazebo locomotion benchmark: whole-body posture
# optimization (Oehler et al.). Optimizes the flipper postures along the
# reference path and retimes it, then drives base and flippers itself through
# benchmark_bridge.py. Runs on athena_description and ctu_marv_description.
name: wbpo
command: ros2 launch whole_body_planning_server benchmark.launch.py
ready:
  publishers: [cmd_vel, joint_commands]
  timeout: 120.0
