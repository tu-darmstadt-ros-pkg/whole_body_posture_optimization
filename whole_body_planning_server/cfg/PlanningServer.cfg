#!/usr/bin/env python
PACKAGE = "whole_body_planning_server"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("enabled",   bool_t,   0, "Enable/disable whole body motion planning",  True)
gen.add("auto_start",   bool_t,   0, "Immediately execute the computed trajectory or wait for confirmation on a topic",  True)
gen.add("continuous_planning", bool_t, 0, "Start execution simultaneously to planning.", False)
gen.add("planning_horizon", double_t, 0, "Length of planning horizon (m). Use the whole path with -1.", -1.0, -1.0, 100)
gen.add("minimum_path_length", double_t, 0, "Minimum length of the path before it is sent to the vehicle_controller during continuous planning.", 0.2, 0, 10)
gen.add("path_sampling_resolution", double_t, 0, "Sampling resolution of poses along the path (m).", 0.05, 0, 1)
gen.add("path_stitching_tolerance", double_t, 0, "If the distance in the stitching seam between new path and old path exceeds this threshold, a new trajectory is planned from scratch.", 0.15, 0, 1)

exit(gen.generate(PACKAGE, "whole_body_planning_server", "PlanningServer"))