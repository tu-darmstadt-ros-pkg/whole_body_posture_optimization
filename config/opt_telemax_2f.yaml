# default
default_joint_state: [0.0, 0.0, 0.0, 0, -2, 1.2, 0, 1, 0, 0] # (10) default for all joints

optimization_type: split
collision_group: arm_group

stability_limit: 0.0
front_tip_support_area_limit: 0.3

complete_robot_group: complete_robot_group
complete_robot_with_world_group: complete_robot_with_world
  
arm_optimization:
  enabled: true
  #algorithm: LD_SLSQP
  #algorithm: LD_MMA
  algorithm: LN_COBYLA
  #algorithm: LD_AUGLAG
  stopping_criteria:
    #maxtime: 0.200
    maxeval: 300
    #ftol_abs: 0.0001
    xtol_abs: 0.001
  local_algorithm: LD_LBFGS
  local_stopping_criteria:
    #maxtime: 0.200
    maxeval: 300
    #ftol_abs: 0.0001
    xtol_abs: 0.01
  sub_algorithm: LD_SLSQP
  sub_stopping_criteria:
    #maxtime: 0.200
    maxeval: 300
    #ftol_abs: 0.0001
    xtol_abs: 0.01
  joints:
    - arm_joint_0
    - arm_joint_1 # first pitch
    - arm_joint_2 # second pitch
    #- arm_joint_3 # middle roll joint
    - arm_joint_4 # third pitch
    #- arm_joint_5 # last roll joint
  environment_collision_default_padding: 0.15
  environment_collision_padding: {
    arm_link_5: 0.3, # additional padding to cover fingers
  }
  self_collision_default_padding: 0.05
  self_collision_padding: {
    arm_link_5: 0.3
  }
  self_collision_tsdf_padding: 0.005
  self_collision_tsdf_truncation_distance: 0.4
  
  objective_parameters:
    function_scale: 1
    exp_parameters: [14.0, -2.6, 0.3]
    lorentzian_sigma: 0.01
    movement_cost_weight: 0.25

  # moveable, but static regarding arm optimization
  # i.e. flipper links
  semi_static_link_names:
    - flipper_front_left_link
    - flipper_front_right_link
    - flipper_back_left_link
    - flipper_back_right_link
    
  static_link_names:
    - spin_lidar_pitch_hokuyo_laser_frame
    - realsense_d435_back_link
    - navigation_module_link
    #- manipulator_base_link
    #- chassis_link
    - autonomy_box_link
    - camera360_center_link

flipper_optimization:
  enabled: true
  #algorithm: GN_DIRECT
  #algorithm: GN_DIRECT_L
  algorithm: GN_ORIG_DIRECT_L
  #algorithm: LN_NELDERMEAD
  #algorithm: LN_PRAXIS
  #algorithm: GN_CRS2_LM
  #algorithm: GN_MLSL
  #algorithm: GN_MLSL_LDS
  #algorithm: LN_COBYLA
  #algorithm: LN_NEWUOA_BOUND
  #algorithm: LN_SBPLX
  #algorithm: LN_AUGLAG
  #algorithm: LN_BOBYQA
  #algorithm: GN_ISRES
  #algorithm: GN_ESCH
  #algorithm: GN_AGS
  #algorithm: G_MLSL
  #algorithm: G_MLSL_LDS
  stopping_criteria:
    maxeval: 100
    #ftol_abs: 1e-3
    #ftol_rel: 9e-1
    #xtol_rel: 1e-1
    #ftol_abs: 1-e2
    
  local_algorithm: LN_NELDERMEAD
  local_stopping_criteria:
    maxeval: 10
    #ftol_rel: 1e-3
    #xtol_rel: 1e-3
    
  joints:
    - flipper_back_joint
    - flipper_front_joint
    
  objective: heuristic
    
  heuristic:
    lorentzian_sigma: 0.01 #0.15
    movement_cost_weight: 0.025  #0.5
    track_contact_weight: 8
    body_contact_weight: 3.0
    verbose: false
    
  stability:
    exp_parameters: [14.0, -2.6, 0.3] 
    lorentzian_sigma: 0.2
    movement_cost_weight: 0.02
  
## Debug
posture_optimization_debug: false
contact_estimation/debug: false    

